<body>

</footer>

<script>
(function(){
  "use strict";
  var CSV_URL = "https://docs.google.com/spreadsheets/d/10O2TfIXYfyJNoFSHHD3ZF7xnL4Q8s4B6gX71WVDnMrA/gviz/tq?tqx=out:csv&gid=1645967364";
  var TOP = 25;
  var SCORE_CAP = 25000;   // drop anything above this — no honest Marathon run gets close

  var board = document.getElementById('board');
  var meta  = document.getElementById('meta');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  }); }
  function myName(){
    try { return (localStorage.getItem('ns.name') || '').trim().toLowerCase(); }
    catch(e){ return ''; }
  }

  function parseDelimited(text){
    var rows = [], row = [], field = '', i = 0, q = false, c;
    for(; i < text.length; i++){
      c = text[i];
      if(q){
        if(c === '"'){ if(text[i + 1] === '"'){ field += '"'; i++; } else q = false; }
        else field += c;
      }
      else if(c === '"'){ q = true; }
      else if(c === ',' || c === '\t'){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c !== '\r'){ field += c; }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }
  function toObjects(text){
    var rows = parseDelimited(text);
    if(rows.length < 2) return [];
    var head = rows.shift().map(function(h){ return String(h).trim().toLowerCase(); });
    return rows.filter(function(r){ return r.join('').trim(); }).map(function(r){
      var o = {};
      head.forEach(function(h, i){ o[h] = r[i] != null ? r[i] : ''; });
      return o;
    });
  }

  function render(list){
    var mine = myName();
    if(!list.length){
      board.innerHTML = '<li class="lb-empty">No scores yet. Be the first &mdash; <a href="/play">play Marathon</a>.</li>';
      return;
    }
    board.innerHTML = list.map(function(e, i){
      var cls = 'li';
      var classes = [];
      if(i < 3) classes.push('top');
      if(mine && e.key === mine) classes.push('you');
      return '<li' + (classes.length ? ' class="' + classes.join(' ') + '"' : '') + '>' +
               '<span class="rk">' + (i + 1) + '</span>' +
               '<span class="nm">' + esc(e.name) + '</span>' +
               '<span class="sc">' + e.score.toLocaleString() + '</span>' +
             '</li>';
    }).join('');
  }

  function load(){
    fetch(CSV_URL + '&v=' + Date.now())
      .then(function(r){ return r.ok ? r.text() : Promise.reject(); })
      .then(function(text){
        var rows = toObjects(text);
        var best = {};
        rows.forEach(function(r){
          var mode = String(r.mode || '').trim().toLowerCase();
          if(mode && mode !== 'marathon') return;
          var name = String(r.name || '').trim().replace(/\s+/g, ' ').slice(0, 16);
          var score = parseInt(String(r.score || '').replace(/[^\d]/g, ''), 10);
          if(!name || !(score > 0) || score > SCORE_CAP) return;
          var key = name.toLowerCase();
          if(!best[key] || score > best[key].score){
            best[key] = { name: name, score: score, key: key };
          }
        });
        var list = Object.keys(best).map(function(k){ return best[k]; })
          .sort(function(a, b){ return b.score - a.score; })
          .slice(0, TOP);
        render(list);
        meta.textContent = list.length
          ? list.length + ' player' + (list.length === 1 ? '' : 's') + ' · updates as new runs come in'
          : '';
      })
      .catch(function(){
        board.innerHTML = '<li class="lb-empty">Could not load the board right now. Try again in a bit.</li>';
      });
  }

  load();
  setInterval(load, 60000);
})();
</script>
<script>
/* pageview ping -> "Naija Scramble - Traffic" Google Form -> linked sheet */
(function(){
  try{
    var r = document.referrer, ref = 'direct';
    if(r){ try{ var h = new URL(r).hostname; ref = h ? (h.indexOf('naijascramble') > -1 ? 'internal' : h) : 'direct'; }catch(e){} }
    var pwa = ((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone) ? 'pwa' : 'web';
    var b = new URLSearchParams();
    b.append('entry.1993350770', location.pathname + ' | ' + ref + ' | ' + pwa + ' | ' + (window.innerWidth || 0));
    fetch('https://docs.google.com/forms/d/e/1FAIpQLSe9BkaRhteedIggqd-wz5INQ8XGNVgiDG2wSappw1GyS-TIbQ/formResponse', { method:'POST', mode:'no-cors', body:b });
  }catch(e){}
})();
</script>
